backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "members"
    label: "Members"
    folder: "content/members"
    create: true
    slug: "{{name}}"
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
      - label: "Role"
        name: "role"
        widget: "string"

  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    slug: "{{title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "string"

  - name: "alumni"
    label: "Alumni"
    folder: "content/alumni"
    create: true
    slug: "{{name}}"
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
      - label: "Grad Year"
        name: "grad_year"
        widget: "string"
      - label: "Notes"
        name: "notes"
        widget: "text"
        required: false
