backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
 - name: "members"
  label: "Members"
  folder: "content/members"
  create: true
  slug: "{{name}}"
  fields:
    - label: "Name"
      name: "name"
      widget: "string"

    - label: "Position"
      name: "role"
      widget: "string"

    - label: "Photo"
      name: "image"
      widget: "image"

    - label: "Grade"
      name: "grade"
      widget: "string"
      required: false

    - label: "Bio"
      name: "bio"
      widget: "text"
      required: false

  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    slug: "{{title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "string"

  - name: "alumni"
    label: "Alumni"
    folder: "content/alumni"
    create: true
    slug: "{{name}}"
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
      - label: "Grad Year"
        name: "grad_year"
        widget: "string"
      - label: "Notes"
        name: "notes"
        widget: "text"
        required: false

  - name: "tryouts"
    label: "Tryouts"
    folder: "content/tryouts"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "state"
    label: "State"
    folder: "content/state"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photos"
    folder: "content/photos"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }

  - name: "community"
    label: "Community"
    folder: "content/community"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "history"
    label: "History"
    folder: "content/history"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "lion_lineage"
    label: "Lion Lineage Competition"
    folder: "content/lion-lineage"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "fundraisers"
    label: "Fundraisers & Donations"
    folder: "content/fundraisers"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "clinics"
    label: "Clinics"
    folder: "content/clinics"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: "sponsors"
    label: "Sponsors"
    folder: "content/sponsors"
    create: true
    slug: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "Website", name: "link", widget: "string", required: false }

  - name: "memorials"
    label: "Memorials"
    folder: "content/memorials"
    create: true
    slug: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Details", name: "body", widget: "markdown" }

 - name: "coaches"
  label: "Coaches"
  folder: "content/coaches"
  create: true
  slug: "{{name}}"
  fields:
    - label: "Name"
      name: "name"
      widget: "string"

    - label: "Team"
      name: "team"
      widget: "select"
      options: ["Varsity", "JV"]

    - label: "Title"
      name: "role"
      widget: "string"

    - label: "Photo"
      name: "image"
      widget: "image"

    - label: "Bio"
      name: "bio"
      widget: "text"
      required: false

    - label: "Email"
      name: "email"
      widget: "string"
      required: false
