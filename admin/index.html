<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linn-Mar Poms CMS</title>
</head>

<body>

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    fetch("config.yml")
      .then(res => res.text())
      .then(yaml => {
        CMS.init({ config: yaml });
      });
  </script>

</body>
</html>
