<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linn-Mar Poms</title>

<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>

<!-- Netlify Identity -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://images.unsplash.com/photo-1599058917765-a780eda07a3e" class="hero-img">

  <div class="hero-overlay">
    <h1>Linn-Mar Poms</h1>
    <p>Nationally Ranked • State • UDA</p>
    <a class="btn">Tryout Info</a>
  </div>
</section>

<!-- MEMBERS -->
<section class="section">
  <h2>Team Members</h2>
  <div id="members"></div>
</section>

<!-- EVENTS -->
<section class="section">
  <h2>Events</h2>
  <div id="events"></div>
</section>

<!-- ALUMNI -->
<section class="section">
  <h2>Alumni</h2>
  <div id="alumni"></div>
</section>

<!-- COACHES -->
<section class="section">
  <h2>Coaches</h2>
  <div id="coaches"></div>
</section>

<!-- TRYOUTS -->
<section class="section">
  <h2>Tryouts</h2>
  <div id="tryouts"></div>
</section>

<!-- STATE -->
<section class="section">
  <h2>State</h2>
  <div id="state"></div>
</section>

<!-- PHOTOS -->
<section class="section">
  <h2>Photos</h2>
  <div id="photos"></div>
</section>

<!-- COMMUNITY -->
<section class="section">
  <h2>Community</h2>
  <div id="community"></div>
</section>

<!-- HISTORY -->
<section class="section">
  <h2>History</h2>
  <div id="history"></div>
</section>

<!-- LION LINEAGE -->
<section class="section">
  <h2>Lion Lineage Competition</h2>
  <div id="lion_lineage"></div>
</section>

<!-- FUNDRAISERS -->
<section class="section">
  <h2>Fundraisers & Donations</h2>

<!-- CLINICS -->
<section class="section">

  <div id="clinics"></div>
</section>

<!-- SPONSORS -->

</section>

<!-- MEMORIALS -->
<section class="section">
  <h2>Memorials</h2>
  <div id="memorials"></div>
</section>

<!-- NETLIFY IDENTITY HANDLER -->
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {

      const hash = window.location.hash;

      if (!user && (hash.includes("invite_token") || hash.includes("recovery_token") || hash.includes("confirmation_token"))) {
        window.netlifyIdentity.open();
      }

      window.netlifyIdentity.on("login", () => {
        document.location.href = "/admin/";
      });

    });
  }
</script>

</body>
</html>
